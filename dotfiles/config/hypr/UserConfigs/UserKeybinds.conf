# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

# settings for User defaults apps - set your default terminal and file manager on this file
source= $UserConfigs/01-UserDefaults.conf 

# Default Browser, Terminal and File Manager
bind = $mainMod, B, exec, xdg-open "https://" # default browser
bind = $mainMod, Return, exec, $term  #terminal
bind = $mainMod, E, exec, $files #file manager

# Rofi
#bind = $mainMod, $mainMod_L, exec, pkill rofi || rofi -show drun -modi drun,filebrowser,run,window # Super Key to Launch rofi menu
bind = $mainMod, R, exec, pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window # Main Menu (APP Launcher)
bind = $mainMod, N, exec, $UserScripts/RofiNotes.sh # Notes Rofi Menu

# JaKooLit's Scripts
bind = $mainMod ALT, O, exec, $scriptsDir/ChangeBlur.sh # Toggle blur settings 
bind = $mainMod SHIFT, G, exec, $scriptsDir/GameMode.sh # Toggle animations ON/OFF
bind = $mainMod ALT, L, exec, $scriptsDir/ChangeLayout.sh # Toggle Master or Dwindle Layout
bind = $mainMod ALT, V, exec, $scriptsDir/ClipManager.sh # Clipboard Manager
bind = $mainMod CTRL, R, exec, $scriptsDir/RofiThemeSelector.sh # KooL Rofi Menu Theme Selector
bind = $mainMod CTRL SHIFT, R, exec, pkill rofi || true && $scriptsDir/RofiThemeSelector-modified.sh # modified Rofi Theme Selector
bind = $mainMod CTRL, B, exec, $scriptsDir/WaybarStyles.sh # Waybar Styles Menu
bind = $mainMod ALT, B, exec, $scriptsDir/WaybarLayout.sh # Waybar Layout Menu
bind = $mainMod, W, exec, $UserScripts/WallpaperSelect.sh # Select wallpaper to apply
bind = $mainMod SHIFT, W, exec, $UserScripts/WallpaperRandom.sh # Random wallpapers
bind = $mainMod, O, exec, hyprctl setprop active opaque toggle # disable opacity on active window
bind = $mainMod ALT, K, exec, $scriptsDir/KeyBinds.sh # search keybinds via rofi

################################################################################################
#####THINGS ADDED BY DAMIEON########THINGS ADDED BY DAMIEON########THINGS ADDED BY DAMIEON###### 
################################################################################################

# Open Apps
bind = $mainMod ALT, S, exec, steam # open steam
bind = $mainMod, D, exec, discord # open discord client
bind = $mainMod, M, exec, geary # open email client
bind = $mainMod, A, exec, kitty --class FastAnime -- fastanime anilist # start anime tui
bind = $mainMod, S, exec, kitty --class rmpc -- rmpc # start music tui
bind = $mainMod CTRL, S, exec, kitty --class rmpc -o allow_remote_control=yes bash -c 'sleep 0.01 && kitty @ set-font-size 13 && exec rmpc' # start music tui flyout
 
# Useful Utilities/Binds
bind = $mainMod ALT, F, exec, hyprfreeze -a # freeze focused application
bind = $mainMod SHIFT, C, exec, hyprpicker -a -f rgb # rgb colorpicker
bind = $mainMod SHIFT CTRL, C, exec, hyprpicker -a -f hex # hex color picker
bind = $mainMod SHIFT CTRL ALT, R, exec, hyprctl reload # soft restart hyprland

# Music Player Daemon Related (MPD)
bind = $mainMod, P, exec, rmpc togglepause # play/pause music
bind = $mainMod, comma, exec, rmpc volume -5 # decrease music volume 5%
bind = $mainMod, period, exec, rmpc volume +5 # increase music volume 5%
bind = $mainMod SHIFT, comma, exec, rmpc prev # previous song
bind = $mainMod SHIFT, period, exec, rmpc next # next song

# Keybinds for Alice keyboard

# MPD
bind = , xf86audiomute, exec, rmpc togglepause # toggle pause with knob
bind = , xf86audioraisevolume, exec, rmpc volume +1 # incrase volume with knob
bind = , xf86audiolowervolume, exec, rmpc volume -1 # decrease volume with knob
bind = SHIFT , xf86audioraisevolume, exec, rmpc next # next song
bind = SHIFT , xf86audiolowervolume, exec, rmpc prev # prev song

# Gamma
bind = CTRL SHIFT,xf86audiolowervolume, exec, hyprctl hyprsunset gamma -10
bind = CTRL SHIFT,xf86audioraisevolume, exec, hyprctl hyprsunset gamma +10

# Gaming Mode Keybind (WILL DISABLE EVERY OTHER KEYBIND UNTIL TURNED OFF)
bind = $mainMod, G, submap, clean
submap = clean 
bind = $mainMod, G, submap, reset
submap = reset
