palette = "noctalia"
format = "$directory$git_branch$git_status$cmd_duration$character"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
format = "$symbol"

[directory]
format = " [$path]($style) "
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = '[$all_status$ahead_behind]($style)'

[cmd_duration]
min_time = 500
format = "took [$duration]($style) "

